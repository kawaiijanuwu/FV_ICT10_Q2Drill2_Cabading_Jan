<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SW1</title>

    <!-- python -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css"/>
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <!-- bootstrap-->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
      /* note: all colors i input were recommended by gemini*/
      body {
        background-color: #0f172a;
        color: #fff;
        min-height: 100vh; /* this makes the body fill the entire screen height */ 
      }
      .tech-container {
        background-color: #1e293b; 
        border: 1px solid #334155;
        border-radius: 12px;
        max-width: 550px;
        width: 100%;
      }
      .btn-tech {
        background-color: #06b6d4;
        color: #0f172a;
      }

      .btn-tech:hover {
        background-color: #22d3ee;
        color: #0f172a;
      }

      .tech-input{
        background-color: #0f172a;
        border: 1px solid #475569;
        color: #fff
      }
    </style>
</head>
<!-- centers the container in the very center hoirzontally and vertically -->
<body class="d-flex align-items-center justify-content-center p-3">

<!-- upper part of the container -->
    <div class="tech-container p-4 text-center">
        <h3 class="fw-bold mb-1 text-info">ICT CLUB CHECKER!</h3>
        <p class="text-secondary small mb-4">Verification System</p>

<!-- first name input field -->
        <div class="text-start mb-3">
            <label for="FIRSTNAME" class="form-label small text-light">First Name</label>
            <input type="text" id="FIRSTNAME" class="form-control tech-input" placeholder="e.g. Jan">
        </div>

<!-- last name input field -->
        <div class="text-start mb-4">
            <label for="SURNAME" class="form-label small text-light">Last Name</label>
            <input type="text" id="SURNAME" class="form-control tech-input" placeholder="e.g. Cabaddie">
        </div>
        
<!-- button that executes the python function in main.py via py-click -->
        <button py-click="check_member" class="btn btn-tech w-100 py-2 mb-3">ADD MEMBER</button>
        
<!-- the output, like the one that executes the python functiion -->
        <div id="result" class="fw-bold fs-6 text-info"></div>
    </div>

    <script type="py" src="main.py"></script>
</body>
</html>
