<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Campus Club Member Management</title>

    <!-- PyScript CSS & JS -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2024.1.1/core.css" />
    <script type="module" src="https://pyscript.net/releases/2024.1.1/core.js"></script>

    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>

    <style>
      /* note: all colors i input were recommended by gemini */
      body {
        background-color: #0f172a;
        color: #fff;
        min-height: 100vh; /* this makes the body fill the entire screen height */ 
      }
      .tech-container {
        background-color: #1e293b; 
        border: 1px solid #334155;
        border-radius: 12px;
        max-width: 550px;
        width: 100%;
      }
      .btn-tech {
        background-color: #06b6d4;
        color: #0f172a;
      }

      .btn-tech:hover {
        background-color: #22d3ee;
        color: #0f172a;
      }

      .tech-input {
        background-color: #0f172a;
        border: 1px solid #475569;
        color: #fff;
      }

      /* White text styling for text typed in inputs */
      .tech-input:focus {
        background-color: #0f172a;
        color: #fff;
      }
    </style>
</head>
<!-- centers the container in the very center horizontally and vertically -->
<body class="d-flex align-items-center justify-content-center">

<!-- upper part of the container -->
    <div class="tech-container p-4 text-center">
        <h3 class="fw-bold">COCC CLUB ADDER</h3>

<!-- first name input field -->
        <div class="text-start">
            <label for="FIRSTNAME" class="form-label small text-light">First Name</label>
            <input type="text" id="FIRSTNAME" class="form-control tech-input" placeholder="e.g. Jan">
        </div>

<!-- last name input field -->
        <div class="text-start mb-4">
            <label for="SURNAME" class="form-label small text-light">Last Name</label>
            <input type="text" id="SURNAME" class="form-control tech-input" placeholder="e.g. Cabaddieee">
        </div>
        
<!-- button that executes the function in main.py using py-click -->
        <button py-click="get_member" class="btn btn-tech w-100 py-2 mb-3 fw-bold">ADD MEMBER</button>
        
<!-- the output container for displaying club total and member list -->
        <div id="result" class="text-start mt-3"></div>
    </div>

    <!-- Script tag connecting to main.py -->
    <script type="py" src="main.py"></script>
</body>
</html>
